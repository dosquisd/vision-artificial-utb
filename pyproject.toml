[project]
name = "vision-artificial"
version = "0.1.0"
description = "It's just a repository where I want to save all the things done on the course. Projects, tasks, etc."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "click>=8.1.8",
    "ipykernel>=6.29.5",
    "labelimg>=1.8.6",
    "lxml>=5.3.2",
    "matplotlib>=3.10.0",
    "nbconvert>=7.16.6",
    "numpy>=2.2.2",
    "onnx>=1.17.0",
    "onnxslim>=0.1.50",
    "opencv-python>=4.11.0.86",
    "pandas>=2.2.3",
    "pooch>=1.8.2",
    "pyqt5==5.15.11",
    "scikit-image>=0.25.1",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "ultralytics>=8.3.23",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.16.0"]
gpu = ["onnxruntime-gpu>=1.16.0"]

[tool.setuptools]
packages = ["project"]
