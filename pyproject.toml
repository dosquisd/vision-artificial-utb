[project]
name = "vision-artificial"
version = "0.1.0"
description = "It's just a repository where I want to save all the things done on the course. Projects, tasks, etc."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "click>=8.1.8",
    "fastapi>=0.115.12",
    "ipykernel>=6.29.5",
    "labelimg>=1.8.6",
    "lxml>=5.3.2",
    "matplotlib>=3.10.0",
    "nbconvert>=7.16.6",
    "numpy>=2.2.2",
    "opencv-python>=4.11.0.86",
    "pandas>=2.2.3",
    "pooch>=1.8.2",
    "pydantic-settings>=2.9.1",
    "pyqt5==5.15.11",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "scikit-image>=0.25.1",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "ultralytics>=8.3.23",
    "uvicorn>=0.34.2",
]

[tool.setuptools]
packages = ["project"]
