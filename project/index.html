<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor de Braille</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1rem;
        }

        .upload-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 3px dashed #dee2e6;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #667eea;
        }

        .upload-area {
            text-align: center;
            cursor: pointer;
        }

        .upload-icon {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-subtext {
            color: #666;
            font-size: 0.9rem;
        }

        #fileInput {
            display: none;
        }

        .options-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .option-group {
            display: flex;
            flex-direction: column;
        }

        .option-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .option-group select,
        .option-group input {
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .option-group select:focus,
        .option-group input:focus {
            outline: none;
            border-color: #667eea;
        }        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }

        .option-group:has(.checkbox-group) {
            justify-content: center;
            align-self: center;
            margin-top: 25px;
        }

        .process-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s ease;
            margin-bottom: 30px;
        }

        .process-btn:hover {
            transform: translateY(-2px);
        }

        .process-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }        .upload-preview-img {
            max-width: 100%;
            max-height: 300px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
        }

        .results-section {
            display: none;
        }

        .image-comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }

        .image-container {
            text-align: center;
        }

        .image-container h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #f5c6cb;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #c3e6cb;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .image-comparison {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔤 Traductor de Braille</h1>
            <p>Sube una imagen con texto en Braille y obtén la traducción automáticamente</p>
        </div>

        <div class="upload-section" onclick="document.getElementById('fileInput').click()">
            <div class="upload-area">
                <div class="upload-icon">📷</div>
                <div class="upload-text">Haz clic para seleccionar una imagen</div>
                <div class="upload-subtext">o arrastra y suelta tu archivo aquí</div>
            </div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="options-section">
            <div class="options-grid">
                <div class="option-group">
                    <label for="characterVersion">Versión del modelo de caracteres:</label>
                    <select id="characterVersion">
                        <option value="v1">v1</option>
                    </select>
                </div>
                  <div class="option-group">
                    <label for="translationVersion">Versión del modelo de traducción:</label>
                    <select id="translationVersion">
                        <option value="v1">v1</option>
                        <option value="v2" selected>v2</option>
                    </select>
                </div>
                
                <div class="option-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="top1" checked>
                        <label for="top1">Usar Top-1 (mejor resultado)</label>
                    </div>
                </div>
            </div>        </div>

        <button class="process-btn" id="processBtn" onclick="processImage()" disabled>
            Procesar Imagen
        </button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Procesando imagen... Por favor espera</p>
        </div>

        <div class="results-section" id="results">
            <h2>Resultados</h2>
            <div class="image-comparison">
                <div class="image-container">
                    <h3>Imagen Original</h3>
                    <img id="originalImage" src="" alt="Imagen original">
                </div>
                <div class="image-container">
                    <h3>Imagen Procesada</h3>
                    <img id="processedImage" src="" alt="Imagen procesada">
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedFile = null;
        const API_BASE_URL = 'http://localhost:8000';

        // Manejar selección de archivo
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                updateUploadSection();
                enableProcessButton();
                previewImage(file);
            }
        });

        // Manejar drag and drop
        const uploadSection = document.querySelector('.upload-section');

        uploadSection.addEventListener('dragover', function(e) {
            e.preventDefault();
            uploadSection.style.borderColor = '#667eea';
            uploadSection.style.backgroundColor = '#f0f8ff';
        });

        uploadSection.addEventListener('dragleave', function(e) {
            e.preventDefault();
            uploadSection.style.borderColor = '#dee2e6';
            uploadSection.style.backgroundColor = '#f8f9fa';
        });

        uploadSection.addEventListener('drop', function(e) {
            e.preventDefault();
            uploadSection.style.borderColor = '#dee2e6';
            uploadSection.style.backgroundColor = '#f8f9fa';
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                if (file.type.startsWith('image/')) {
                    selectedFile = file;
                    updateUploadSection();
                    enableProcessButton();
                    previewImage(file);
                } else {
                    showError('Por favor selecciona un archivo de imagen válido.');
                }
            }
        });        function updateUploadSection() {
            const uploadArea = document.querySelector('.upload-area');
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadArea.innerHTML = `
                    <img src="${e.target.result}" alt="Vista previa" class="upload-preview-img">
                    <div class="upload-icon">✅</div>
                    <div class="upload-text">Archivo seleccionado: ${selectedFile.name}</div>
                    <div class="upload-subtext">Haz clic para cambiar la imagen</div>
                `;
            };
            reader.readAsDataURL(selectedFile);
        }

        function enableProcessButton() {
            document.getElementById('processBtn').disabled = false;
        }

        function previewImage(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                // Preparar para la comparación final
                document.getElementById('originalImage').src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function processImage() {
            if (!selectedFile) {
                showError('Por favor selecciona una imagen primero.');
                return;
            }            // Mostrar loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            document.getElementById('processBtn').disabled = true;
            clearMessages();

            // Preparar query parameters
            const queryParams = new URLSearchParams({
                character_model_version: document.getElementById('characterVersion').value,
                translation_model_version: document.getElementById('translationVersion').value,
                top1: document.getElementById('top1').checked
            });

            // Preparar FormData solo con la imagen
            const formData = new FormData();
            formData.append('image', selectedFile);

            try {
                const response = await fetch(`${API_BASE_URL}/braille?${queryParams}`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }

                // Convertir la respuesta a blob para mostrar la imagen
                const blob = await response.blob();
                const imageUrl = URL.createObjectURL(blob);
                
                // Mostrar resultado
                document.getElementById('processedImage').src = imageUrl;
                document.getElementById('results').style.display = 'block';
                showSuccess('¡Imagen procesada exitosamente!');            } catch (error) {
                console.error('Error completo:', error);
                if (error.name === 'TypeError' && error.message.includes('Failed to fetch')) {
                    showError('Error de conexión: No se pudo conectar al servidor. Verifica que la API esté ejecutándose en http://localhost:8000 y que no haya problemas de CORS.');
                } else {
                    showError(`Error al procesar la imagen: ${error.message}`);
                }
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('processBtn').disabled = false;
            }
        }

        function showError(message) {
            clearMessages();
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;
            document.querySelector('.container').insertBefore(errorDiv, document.getElementById('loading'));
        }

        function showSuccess(message) {
            clearMessages();
            const successDiv = document.createElement('div');
            successDiv.className = 'success';
            successDiv.textContent = message;
            document.querySelector('.container').insertBefore(successDiv, document.getElementById('loading'));
        }

        function clearMessages() {
            const messages = document.querySelectorAll('.error, .success');
            messages.forEach(msg => msg.remove());
        }        // Verificar conexión con la API al cargar la página
        async function checkAPIConnection() {
            try {
                console.log('Verificando conexión con:', `${API_BASE_URL}/`);
                const response = await fetch(`${API_BASE_URL}/`, {
                    method: 'GET',
                    mode: 'cors'
                });
                if (response.ok) {
                    const data = await response.json();
                    console.log('Respuesta del servidor:', data);
                    showSuccess('Conectado al servidor correctamente');
                    setTimeout(clearMessages, 3000);
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                console.error('Error de conexión:', error);
                showError('No se pudo conectar al servidor. Asegúrate de que la API esté ejecutándose en http://localhost:8000');
            }
        }

        // Verificar conexión al cargar la página
        window.addEventListener('load', checkAPIConnection);
    </script>
</body>
</html>
